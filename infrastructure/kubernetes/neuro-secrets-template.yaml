apiVersion: v1
kind: Secret
metadata:
  name: neuro-secrets
  namespace: neuro-genomic
type: Opaque
stringData:
  # Replace the placeholder values and apply with: kubectl apply -f neuro-secrets-template.yaml
  database-url: "postgresql://neuro_user:neuro_pass@postgres:5432/neuro_genomic"
  redis-url: "redis://redis:6379/0"
  minio-endpoint: "http://minio:9000"
  minio-access-key: "minioadmin"
  minio-secret-key: "minioadmin"
