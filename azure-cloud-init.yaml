#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - git

runcmd:
  # Install Docker
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -
  - add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io
  
  # Install Docker Compose V2
  - mkdir -p /usr/local/lib/docker/cli-plugins
  - curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  
  # Setup the AI platform
  - mkdir -p /opt/neuro-genomic-ai
  - cd /opt/neuro-genomic-ai
  
  # Clone the repository from GitHub
  - git clone https://github.com/ibrahim2002-dev/Neurogenomic2.git .
  
  # Start the services via Docker Compose
  - docker compose up -d --build
  
  # Wait for services to stabilize
  - sleep 30
  
  # Verify API is running
  - curl -f http://localhost:8000/health || echo "Warning: API health check failed"
